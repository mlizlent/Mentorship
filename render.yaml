services:
  - type: web
    name: crownpath-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crownpath-db
          property: connectionString
      - key: MAX_OPEN_CONNS
        value: 25
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 168h
      - key: BCRYPT_COST
        value: 12
      - key: MENTOR_CAPACITY
        value: 3
      - key: WEIGHT_SKILLS
        value: 40
      - key: WEIGHT_AVAILABILITY
        value: 25
      - key: WEIGHT_CAPACITY
        value: 15
      - key: WEIGHT_LANGUAGE
        value: 10
      - key: WEIGHT_EXPERIENCE_FIT
        value: 10
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 1025
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: noreply@crownpath.app
      - key: FRONTEND_URL
        value: https://crownpath-web.onrender.com

  - type: web
    name: crownpath-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://crownpath-api.onrender.com/api/v1

databases:
  - name: crownpath-db
    databaseName: malkia
    user: malkia
    plan: free