services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: malkia
      POSTGRES_PASSWORD: malkia
      POSTGRES_DB: malkia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malkia -d malkia"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailer:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://malkia:malkia@db:5432/malkia?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      ENVIRONMENT: production
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
