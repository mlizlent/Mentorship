linters:
  enable:
    - gofmt
    - goimports
    - govet
    - errcheck
    - staticcheck
    - unused
    - misspell
  disable:
    - gochecknoglobals
    - gochecknoinits

linters-settings:
  goimports:
    local-prefixes: malkia-mentor/api
  misspell:
    locale: US

issues:
  exclude-rules:
    - linters:
        - errcheck
      text: '.*\.Close\(\)'
    - linters:
        - errcheck
      text: '.*\.Write\(\)'

run:
  tests: true
  timeout: 5m
